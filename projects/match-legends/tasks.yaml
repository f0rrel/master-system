tasks:
- id: ml-1
  milestone: m2-overnight
  title: Seeded random number generator
  status: completed
  description: 'In www/js/match-logic.js, inside the marked section ''TASK SECTION
    ml-1'', add createRng(seed): a deterministic generator (for example mulberry32)
    returning floats in [0, 1), and export it as api.createRng. The board functions
    already accept an rng parameter. Read tests/tasks/ml-1-seeded-rng.test.js for
    the exact requirements. Change nothing outside that section unless strictly needed.
    Replace old code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - node --test tests/tasks/ml-1-seeded-rng.test.js
    - npx playwright test tests/smoke
    protected_paths: &id001
    - tests/*
    - package.json
    - package-lock.json
    - playwright.config.js
    - .nvmrc
- id: ml-2
  milestone: m2-overnight
  title: Shuffle the board in place when no moves are left
  status: completed
  description: 'In www/js/match-logic.js, inside ''TASK SECTION ml-2'', add shuffleBoard(board,
    rng): return a NEW board that rearranges the same tiles (same cells, same type
    counts) so it has no matches and at least one legal move; do not modify the input;
    deterministic for a given rng. Export it as api.shuffleBoard. Then, in www/index.html,
    where the game says ''No moves left — board reshuffled'' and deals a fresh board,
    use MatchLogic.shuffleBoard(session.board) instead. Requirements: tests/tasks/ml-2-shuffle.test.js.
    Replace old code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - node --test tests/tasks/ml-2-shuffle.test.js
    - npx playwright test tests/smoke
    protected_paths: *id001
- id: ml-3
  milestone: m2-overnight
  title: Extract the scoring rules into scoreMatch
  status: completed
  description: 'In www/js/match-logic.js, inside ''TASK SECTION ml-3'', add scoreMatch({size,
    maxRun, combo, buffMult}) implementing the game''s existing scoring: size * BASE_POINTS
    * combo * sizeBonus (2 for a run of 5+, 1.5 for 4, else 1), rounded; then, if
    buffMult is given, multiplied by it and rounded again. Export it as api.scoreMatch,
    and make resolveCascade in www/index.html use it instead of computing the score
    inline. Requirements: tests/tasks/ml-3-scoring.test.js.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - node --test tests/tasks/ml-3-scoring.test.js
    - npx playwright test tests/smoke
    protected_paths: *id001
- id: ml-4
  milestone: m2-overnight
  title: Hint button
  status: completed
  description: 'In www/js/match-logic.js, inside ''TASK SECTION ml-4'', add findHint(board):
    return {a: {q, r}, b: {q, r}}, two adjacent cells whose swap makes a match, or
    null; do not modify the board. Export it as api.findHint. In www/index.html add
    a visible button with id ''hint-btn'' on the game screen; clicking it adds the
    CSS class ''hint'' (give it a visible style) to exactly those two tiles, without
    using up a move. Requirements: tests/tasks/ml-4-hint.test.js and tests/tasks/ml-4-hint.spec.js.
    Replace old code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - node --test tests/tasks/ml-4-hint.test.js
    - npx playwright test tests/tasks/ml-4-hint.spec.js
    - npx playwright test tests/smoke
    protected_paths: *id001
- id: ml-5
  milestone: m2-overnight
  title: Persist progress in localStorage
  status: completed
  description: 'In www/index.html, make the Storage object fall back to localStorage
    when window.storage is not available, for both load and save, so progress (gems,
    unlocked legends, the chosen legend, unlocked levels) survives a reload. Keep
    window.storage as the first choice when it exists. Requirements: tests/tasks/ml-5-persist.spec.js.
    Replace old code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - npx playwright test tests/tasks/ml-5-persist.spec.js
    - npx playwright test tests/smoke
    protected_paths: *id001
- id: ml-6
  milestone: m2-batch-2
  title: Resume an unfinished level after closing the game
  status: completed
  description: 'In www/index.html, after every move in a solo level save the level
    being played (level id, board, score, moves left, power charge) through the existing
    Storage object under the key ''ml_session''. Clear it when the level ends (win
    or loss). On startup, if a saved level exists, show a button with id ''btn-continue''
    on the home screen whose text names the level (for example ''Continue Level 2'');
    clicking it restores exactly that level, board, score and moves. When nothing
    is saved the button is not visible. Note: the game''s .menu-btn CSS overrides
    the hidden attribute, so hide it with style or a class. Requirements: tests/tasks/ml-6-resume-level.spec.js.
    Replace old code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - npx playwright test tests/tasks/ml-6-resume-level.spec.js
    - npx playwright test tests/smoke
    protected_paths: &id002
    - tests/*
    - package.json
    - package-lock.json
    - playwright.config.js
    - .nvmrc
  manual_check: '1. Open www/index.html (or the app), start Level 1 and play two or
    three moves.

    2. Note the score and moves left, then close the tab or the app completely.

    3. Open the game again: the home screen shows ''Continue Level 1''.

    4. Tap it: the same board, score and moves left are back.

    5. Finish or lose the level, reopen the game: no Continue button.'
- id: ml-7
  milestone: m2-batch-2
  title: Debug panel with ?debug=1
  status: completed
  description: 'In www/index.html, when the page URL has ?debug=1, show a small fixed
    panel with id ''debug-panel'' on every screen (it must not exist without ?debug=1).
    Deal every solo level from a seed with MatchLogic.createRng (random seed unless
    one is set) and keep it as session.seed, so a board is reproducible. The panel
    has: #debug-seed (current seed), #debug-seed-input and #debug-seed-apply (restart
    the current level, or level 1, dealt from that seed); #debug-force-stuck (replace
    the board with one that has no legal move and run the game''s normal ''No moves
    left - board reshuffled'' path); #debug-progress (the saved progress JSON, kept
    up to date) and #debug-clear-progress (delete saved progress and reset to a new
    player); #debug-level (a select with levels 1-6) and #debug-go-level (start that
    level even if locked, without unlocking it). Keep the panel small so it does not
    cover the board. Requirements: tests/tasks/ml-7-debug-panel.spec.js. Replace old
    code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - npx playwright test tests/tasks/ml-7-debug-panel.spec.js
    - npx playwright test tests/smoke
    protected_paths: *id002
  manual_check: '1. Open www/index.html without ?debug=1: no debug panel.

    2. Open www/index.html?debug=1: a small panel is visible on the home screen.

    3. Start Level 1, note the seed; enter 12345 and press the seed button: the level
    restarts; do it twice and check the board is identical both times.

    4. Press ''stuck'': the toast says the board was reshuffled and you can still
    make a move.

    5. Choose another legend: the progress field shows it; press clear and reload:
    back to Marcus.

    6. Choose level 5 and press go: Chapter 5 starts although it is locked.'
- id: ml-8
  milestone: m2-batch-2
  title: Star rating on the results screen
  status: completed
  description: 'In www/js/match-logic.js, inside ''TASK SECTION ml-8'', add starsForScore(score,
    target): 0 below the target, 1 at or above it, 2 at or above 1.25 x target, 3
    at or above 1.5 x target; export it as api.starsForScore. In www/index.html, add
    an element with id ''res-stars'' to the results screen: its data-stars attribute
    is the rating and its text is that many filled stars followed by empty ones, three
    in total (for example ''★★☆''); a loss shows ''☆☆☆''. Requirements: tests/tasks/ml-8-stars.test.js
    and tests/tasks/ml-8-stars.spec.js. Replace old code; don''t leave the previous
    implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - node --test tests/unit/*.test.js
    - node --test tests/tasks/ml-8-stars.test.js
    - npx playwright test tests/tasks/ml-8-stars.spec.js
    - npx playwright test tests/smoke
    protected_paths: *id002
  manual_check: '1. Win Level 1 just above the target (1800): the results screen shows
    ★☆☆.

    2. Win a level with 1.5 x the target or more: ★★★.

    3. Run out of moves: ☆☆☆.'
- id: ml-9
  milestone: epic-juice
  title: Effects toggle next to the sound toggle
  status: completed
  size: small
  description: 'In www/index.html only, add the shared effects setting and a visible
    toggle. Add one clearly marked block (// ==== ML-JUICE: effects switch ====) at
    the end of the game script that defines window.effectsEnabled() returning the
    current boolean (true unless the player turned it off) and window.setEffectsEnabled(on)
    which sets it and stores it the same way the existing sound setting is stored,
    so it survives closing and reopening the game (a fresh start defaults to on).
    Add a small button next to the existing 🔊 sound toggle, in the same row and with
    the same look, with the accessible name ''Effects'' (e.g. aria-label=''Effects''
    and a visible on/off state), which flips the setting and re-renders its own state.
    It must not change the volume or the behaviour of the sound toggle, the debug
    panel or any game logic, and add no CSS animation. Replace old code; don''t leave
    the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright test tests/tasks/ml-9-effects-toggle.spec.js
    - node --test tests/unit/*.test.js
    - npx playwright test tests/smoke
    protected_paths:
    - tests/*
    - package.json
    - package-lock.json
    - playwright.config.js
    - .nvmrc
  manual_check: 1. Open the preview link. 2. A small 'Effects' toggle sits next to
    the 🔊 button; tap it — it turns off. 3. Reload the page — it is still off. 4.
    In the console type effectsEnabled() — it prints false; type setEffectsEnabled(true)
    — it prints true. 5. The 🔊 button still mutes and unmutes exactly as before.
- id: ml-10
  milestone: epic-juice
  title: Tile clear pop (extend matchPop)
  status: completed
  size: small
  description: 'In www/index.html only, extend the existing matchPop effect so a cleared
    tile visibly pops. While a tile is being cleared it keeps the existing ''matchPop''
    class with a pop keyframe (scale up, then out) lasting 400 ms or less, and the
    class is removed when the pop ends (animationend plus a setTimeout fallback) so
    it never sticks. Keep the existing clearing timing and behaviour — do not add
    a second clearing pass and do not delay gravity. Do not delay the game: no awaits,
    no blocking, the next move must work immediately. When the player prefers reduced
    motion (matchMedia(''(prefers-reduced-motion: reduce)'').matches) add no class
    and no animation (the tiles just clear), and when window.effectsEnabled exists
    and returns false skip it too; guard for the switch not existing yet. Add the
    pop CSS in its own clearly marked block (/* ==== ML-JUICE: tile clear pop ====
    */) and the JS in a matching marked block at the end of the script. Replace old
    code; don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright test tests/tasks/ml-10-tile-clear-pop.spec.js
    - node --test tests/unit/*.test.js
    - npx playwright test tests/smoke
    protected_paths:
    - tests/*
    - package.json
    - package-lock.json
    - playwright.config.js
    - .nvmrc
  manual_check: 1. Open the preview link and start Chapter 1. 2. Swap two tiles to
    make a match — the matched tiles visibly pop before they vanish. 3. Make another
    match straight away — the next move is accepted immediately. 4. Turn on 'reduce
    motion' and repeat — the tiles just clear, no pop, and the game still plays.
