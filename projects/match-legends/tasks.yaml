  status: completed
  size: small
  description: 'In www/index.html only, add a CSS-only burst on the win screen and
    none on the loss screen. The results overlay the game already shows (its existing
    element, keeping every class it already has) gets the class ''win'' when the player
    won and ''lose'' when they lost — add these two classes if they are not there
    yet. In your own clearly marked CSS block (/* ==== ML-JUICE: win burst ==== */)
    give the overlay''s .win state a short CSS-keyframe burst (a radial flash and
