id: match-legends
name: Match Legends
description: >
  The Match Legends mobile game (github.com/f0rrel/Match_Legends_mobile_game),
  managed in a dedicated clone. The system integrates verified work into
  develop and publishes it (GitHub App); main changes only through a release
  the owner merges on GitHub.
status: active
repository: ~/AI/managed/match-legends
base_branch: develop
auto_integrate: true
github:
  repo: f0rrel/Match_Legends_mobile_game
  release_branch: main
  site_dir: www
planner:
  test_dir: tests/tasks
  setup:
  - npm ci --prefer-offline --no-audit --no-fund
  base_checks:
  - node --test tests/unit/*.test.js
  - npx playwright test tests/smoke
  protected_paths:
  - tests/*
  - package.json
  - package-lock.json
  - playwright.config.js
  - .nvmrc
