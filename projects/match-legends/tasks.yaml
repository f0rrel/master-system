    (matchMedia(''(prefers-reduced-motion: reduce)'').matches) and no burst when window.effectsEnabled
    exists and returns false; guard for the switch not existing yet. Replace old code;
    don''t leave the previous implementation behind as a fallback.'
  acceptance:
    commands:
    - npm ci --prefer-offline --no-audit --no-fund
    - npx playwright test tests/tasks/ml-13-win-burst.spec.js
    - node --test tests/unit/*.test.js
    - npx playwright test tests/smoke
    protected_paths:
    - tests/*
    - package.json
    - package-lock.json
    - playwright.config.js
    - .nvmrc
  manual_check: 1. Open the preview link and finish Chapter 1 with a win — the win
    screen flashes outward once. 2. Fail a level — the loss screen shows no burst.
    3. Tap Play again straight away — the results screen still works exactly as before.
